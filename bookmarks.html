<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Portal — Offline Dashboard</title>
  
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <style>
    :root {
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      
      /* Light Theme Variables */
      --bg-primary: hsl(210, 40%, 98%);
      --bg-secondary: hsl(0, 0%, 100%);
      --bg-glass: rgba(255, 255, 255, 0.75);
      --border-color: hsl(214, 32%, 91%);
      --border-focus: hsl(221, 83%, 60%);
      
      --text-primary: hsl(222, 47%, 11%);
      --text-secondary: hsl(215, 16%, 47%);
      --text-muted: hsl(215, 16%, 65%);
      
      --color-primary: hsl(221, 83%, 53%);
      --color-primary-hover: hsl(221, 83%, 45%);
      --color-primary-light: hsl(221, 83%, 95%);
      
      --color-success: hsl(142, 71%, 45%);
      --color-success-light: hsl(142, 71%, 95%);
      --color-danger: hsl(346, 84%, 61%);
      --color-danger-light: hsl(346, 84%, 95%);
      --color-warning: hsl(38, 92%, 50%);
      --color-warning-light: hsl(38, 92%, 95%);
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
      --shadow-glow: 0 0 20px rgba(37, 99, 235, 0.12);
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      
      --transition-fast: 0.15s ease;
      --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.4s ease;
    }

    [data-theme="dark"] {
      /* Dark Theme Variables */
      --bg-primary: hsl(222, 47%, 6%);
      --bg-secondary: hsl(222, 47%, 10%);
      --bg-glass: rgba(15, 23, 42, 0.75);
      --border-color: hsl(217, 33%, 17%);
      --border-focus: hsl(217, 91%, 60%);
      
      --text-primary: hsl(213, 27%, 92%);
      --text-secondary: hsl(215, 16%, 65%);
      --text-muted: hsl(215, 16%, 45%);
      
      --color-primary: hsl(217, 91%, 60%);
      --color-primary-hover: hsl(217, 91%, 55%);
      --color-primary-light: hsl(217, 91%, 15%);
      
      --color-success: hsl(142, 71%, 45%);
      --color-success-light: hsl(142, 71%, 12%);
      --color-danger: hsl(346, 84%, 61%);
      --color-danger-light: hsl(346, 84%, 12%);
      --color-warning: hsl(38, 92%, 50%);
      --color-warning-light: hsl(38, 92%, 12%);
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
      --shadow-glow: 0 0 20px rgba(59, 130, 246, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color var(--transition-normal), color var(--transition-normal);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Layout Utilities */
    .app-container {
      display: flex;
      flex: 1;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      position: relative;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: var(--radius-full);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* Header Styling */
    header {
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1rem 1.5rem;
      transition: background-color var(--transition-normal), border-color var(--transition-normal);
    }

    .header-content {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-container {
      width: 42px;
      height: 42px;
      background: var(--color-primary);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: var(--shadow-glow);
    }

    .brand-text h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .brand-text span {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .clock-display {
      font-size: 0.875rem;
      color: var(--text-secondary);
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-variant-numeric: tabular-nums;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* Input & Search Components */
    .search-wrapper {
      position: relative;
      width: 280px;
      transition: width var(--transition-normal);
    }

    .search-wrapper:focus-within {
      width: 360px;
    }

    .search-input {
      width: 100%;
      padding: 0.625rem 1rem 0.625rem 2.5rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.875rem;
      outline: none;
      transition: all var(--transition-normal);
    }

    .search-input:focus {
      border-color: var(--border-focus);
      background: var(--bg-secondary);
      box-shadow: var(--shadow-glow);
    }

    .search-icon {
      position: absolute;
      left: 0.875rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-shortcut {
      position: absolute;
      right: 0.875rem;
      top: 50%;
      transform: translateY(-50%);
      background: var(--border-color);
      color: var(--text-secondary);
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      border-radius: var(--radius-sm);
      font-family: monospace;
      pointer-events: none;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.625rem 1.25rem;
      border-radius: var(--radius-full);
      font-family: var(--font-sans);
      font-size: 0.875rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all var(--transition-fast);
      text-decoration: none;
    }

    .btn-icon-only {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: var(--radius-full);
      flex-shrink: 0;
    }

    .btn-primary {
      background: var(--color-primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--color-primary-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-glow);
    }

    .btn-secondary {
      background: var(--bg-primary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: var(--border-color);
    }

    .btn-danger {
      background: var(--color-danger-light);
      color: var(--color-danger);
    }

    .btn-danger:hover {
      background: var(--color-danger);
      color: white;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 280px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      transition: transform var(--transition-normal), background-color var(--transition-normal);
      flex-shrink: 0;
      height: calc(100vh - 75px);
      position: sticky;
      top: 75px;
      overflow-y: auto;
    }

    .sidebar-section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      padding-left: 0.5rem;
    }

    .category-list, .tags-cloud {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .category-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.625rem 0.75rem;
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all var(--transition-fast);
      user-select: none;
      border: 1px solid transparent;
    }

    .category-item:hover {
      background: var(--bg-primary);
      color: var(--text-primary);
    }

    .category-item.active {
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-weight: 600;
      border-color: rgba(37, 99, 235, 0.1);
    }

    .category-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .category-badge {
      background: var(--border-color);
      color: var(--text-secondary);
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: var(--radius-full);
      font-weight: 600;
    }

    .category-item.active .category-badge {
      background: var(--color-primary);
      color: white;
    }

    /* Tags Cloud */
    .tags-cloud {
      flex-direction: row;
      flex-wrap: wrap;
      gap: 0.375rem;
      padding: 0.5rem;
    }

    .tag-badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.625rem;
      border-radius: var(--radius-full);
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .tag-badge:hover {
      border-color: var(--text-muted);
      color: var(--text-primary);
    }

    .tag-badge.active {
      background: var(--text-primary);
      color: var(--bg-secondary);
      border-color: var(--text-primary);
    }

    /* Main Content Area */
    main {
      flex: 1;
      padding: 2rem;
      min-width: 0;
    }

    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .active-filters {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding: 0.75rem 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      animation: fadeIn 0.2s ease-out;
    }

    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem 0.5rem;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .filter-chip button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
    }

    .filter-chip button:hover {
      color: var(--color-danger);
    }

    /* Bookmarks Grid & Cards */
    .bookmarks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
      align-items: start;
    }

    .section-title {
      font-size: 1.125rem;
      font-weight: 700;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .bookmark-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all var(--transition-normal);
      cursor: pointer;
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }

    .bookmark-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: var(--border-focus);
    }

    .card-top {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .favicon-wrapper {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: var(--bg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .favicon-img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .favicon-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.05em;
    }

    .card-actions {
      display: flex;
      gap: 0.25rem;
      opacity: 0;
      transform: translateY(2px);
      transition: all var(--transition-fast);
    }

    .bookmark-card:hover .card-actions {
      opacity: 1;
      transform: translateY(0);
    }

    .action-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      width: 28px;
      height: 28px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .action-btn:hover {
      background: var(--bg-primary);
      color: var(--text-primary);
    }

    .action-btn.edit-btn:hover {
      color: var(--color-primary);
    }

    .action-btn.delete-btn:hover {
      color: var(--color-danger);
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      min-width: 0; /* fixes truncate overflow inside flexbox */
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-domain {
      font-size: 0.75rem;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      text-decoration: none;
    }

    .card-domain:hover {
      color: var(--color-primary);
      text-decoration: underline;
    }

    .card-description {
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 0.25rem;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-top: auto;
      padding-top: 0.75rem;
    }

    .card-tag {
      font-size: 0.7rem;
      padding: 0.1rem 0.4rem;
      border-radius: var(--radius-sm);
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    /* Modal / Dialog box styling */
    dialog {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      color: var(--text-primary);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      width: 90%;
      max-width: 480px;
      box-shadow: var(--shadow-lg);
      outline: none;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    dialog::backdrop {
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      transition: opacity 0.2s ease;
    }

    dialog[open] {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .dialog-header h3 {
      font-size: 1.125rem;
      font-weight: 700;
    }

    .dialog-close {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      margin-bottom: 1rem;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .form-control {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.875rem;
      outline: none;
      transition: all var(--transition-fast);
    }

    .form-control:focus {
      border-color: var(--border-focus);
      background: var(--bg-secondary);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 80px;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    /* Toasts system */
    .toast-container {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: 320px;
    }

    .toast {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--color-primary);
      color: var(--text-primary);
      padding: 0.875rem 1.25rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      font-size: 0.875rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transform: translateX(100%);
      opacity: 0;
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .toast.toast-success {
      border-left-color: var(--color-success);
    }

    .toast.toast-danger {
      border-left-color: var(--color-danger);
    }

    .toast.toast-warning {
      border-left-color: var(--color-warning);
    }

    @keyframes slideIn {
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .toast-icon {
      flex-shrink: 0;
    }

    /* Empty states */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      border: 2px dashed var(--border-color);
      border-radius: var(--radius-lg);
      background: var(--bg-secondary);
      margin-top: 2rem;
    }

    .empty-state-icon {
      width: 64px;
      height: 64px;
      background: var(--bg-primary);
      color: var(--text-muted);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-state h3 {
      font-size: 1.125rem;
      font-weight: 600;
    }

    .empty-state p {
      font-size: 0.875rem;
      color: var(--text-secondary);
      max-width: 320px;
    }

    /* Responsive adjustments */
    @media (max-width: 1024px) {
      .app-container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
        position: static;
        padding: 1rem;
      }
      .category-list {
        flex-direction: row;
        overflow-x: auto;
        padding-bottom: 0.5rem;
      }
      .category-item {
        white-space: nowrap;
      }
    }

    @media (max-width: 768px) {
      header {
        padding: 0.75rem 1rem;
      }
      .header-content {
        flex-direction: column;
        align-items: stretch;
      }
      .search-wrapper {
        width: 100%;
      }
      .search-wrapper:focus-within {
        width: 100%;
      }
      .clock-display {
        display: none;
      }
      main {
        padding: 1rem;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="header-content">
      <div class="brand-section">
        <div class="logo-container" id="brand-logo">
          <!-- logo svg injected in script -->
        </div>
        <div class="brand-text">
          <h1>Portal</h1>
          <span>Offline Bookmarks</span>
        </div>
      </div>

      <div class="clock-display" id="clock-container">
        <span id="clock-icon"></span>
        <span id="clock-text">--:--:--</span>
      </div>

      <div class="header-actions">
        <div class="search-wrapper">
          <span class="search-icon" id="search-icon-svg"></span>

  <!-- JavaScript logic -->
  <script>
    // Embedded SVG Icon Database for Offline-first execution
    const ICONS = {
      bookmark: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>',

      external: '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>',

      upload: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>',
      tag: '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>',
      clock: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>',
      x: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>',
      check: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>',
      folder: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>',
      folderOpen: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><path d="M2 10h20"></path></svg>',
      copy: '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>',
      alert: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>'
    };

    function injectIcons() {
      document.getElementById('brand-logo').innerHTML = ICONS.bookmark;
      document.getElementById('clock-icon').innerHTML = ICONS.clock;
      document.getElementById('search-icon-svg').innerHTML = ICONS.search;
      document.querySelector('.btn-plus-icon').innerHTML = ICONS.plus;
      
      document.querySelector('.export-icon').innerHTML = ICONS.download;
      document.querySelector('.import-icon').innerHTML = ICONS.upload;
      document.querySelector('.trash-icon').innerHTML = ICONS.trash;
      document.getElementById('title-icon').innerHTML = ICONS.bookmark;
      document.getElementById('open-all-cat-btn').innerHTML = ICONS.folderOpen;
      document.querySelector('.bookmark-icon').innerHTML = ICONS.bookmark;
      document.getElementById('dialog-close-btn').innerHTML = ICONS.x;
      document.getElementById('cat-dialog-close-btn').innerHTML = ICONS.x;
      document.querySelector('.plus-icon').innerHTML = ICONS.plus;
    }

    // Default Seed Data
    const defaultBookmarks = [
      { id: 1, category: "Daily", name: "Google Keep", url: "https://keep.google.com/u/0/#home", tags: ["notes", "google"], description: "My quick notes and lists." },
      { id: 2, category: "Daily", name: "Google Calendar", url: "https://calendar.google.com/calendar/u/0/r/week", tags: ["schedule", "google"], description: "Weekly calendar overview." },
      { id: 4, category: "Daily", name: "YouTube", url: "https://www.youtube.com/", tags: ["entertainment", "video"], description: "Watch tutorials and videos." },
      { id: 5, category: "Daily", name: "WhatsApp Web", url: "https://web.whatsapp.com/", tags: ["chat", "social"], description: "Web messaging client." },
      { id: 7, category: "Social", name: "Facebook", url: "https://www.facebook.com/", tags: ["social"], description: "Social network connect." },
      { id: 8, category: "Social", name: "Instagram", url: "https://www.instagram.com/", tags: ["social", "photos"], description: "Browse photos and stories." },
      { id: 11, category: "Professional", name: "LinkedIn", url: "https://www.linkedin.com/in/mayank-patel-a7627b1a6/", tags: ["career", "social"], description: "My professional profile." },
      { id: 26, category: "Tech", name: "GitHub", url: "https://github.com/", tags: ["code", "git"], description: "Hosting for code repositories." },
      { id: 28, category: "Tech", name: "LeetCode", url: "https://leetcode.com/problemset/", tags: ["code", "practice"], description: "Algorithm challenges." }
    ];

    const defaultCategories = ["Daily", "Social", "Professional", "Tech"];

    // App State Management
    let state = {
      bookmarks: [],
      categories: [],
      activeCategory: 'All',
      activeTag: null,
      searchQuery: '',
      theme: 'light'
    };

    // Load initial state
    function loadState() {
      const storedBookmarks = localStorage.getItem('portal-bookmarks');
      const storedCategories = localStorage.getItem('portal-categories');
      const storedTheme = localStorage.getItem('portal-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

      state.bookmarks = storedBookmarks ? JSON.parse(storedBookmarks) : defaultBookmarks;
      state.categories = storedCategories ? JSON.parse(storedCategories) : defaultCategories;
      state.theme = storedTheme;

      document.documentElement.setAttribute('data-theme', state.theme);
      updateThemeButton();
    }

    function saveState() {
      localStorage.setItem('portal-bookmarks', JSON.stringify(state.bookmarks));
      localStorage.setItem('portal-categories', JSON.stringify(state.categories));
      localStorage.setItem('portal-theme', state.theme);
    }

    // Dynamic Clock
    function initClock() {
      function tick() {
        const now = new Date();
        const options = { weekday: 'short', month: 'short', day: 'numeric' };
        const dateStr = now.toLocaleDateString('en-US', options);
        const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
        document.getElementById('clock-text').textContent = `${dateStr}  ${timeStr}`;
      }
      tick();
      setInterval(tick, 1000);
    }

    // Theme Toggle
    function toggleTheme() {
      state.theme = state.theme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', state.theme);
      saveState();
      updateThemeButton();
      showToast(`Switched to ${state.theme} mode`, 'success');
    }

    function updateThemeButton() {
      const btn = document.getElementById('theme-toggle-btn');
      btn.innerHTML = state.theme === 'light' ? ICONS.moon : ICONS.sun;
    }

    // Favicon Fallbacks (Color and Initials based on Title)
    function handleFaviconError(img, name) {
      const wrapper = img.parentNode;
      if (!wrapper) return;

      const fallback = document.createElement('div');
      fallback.className = 'favicon-fallback';
      
      // Hash name to get unique stable background color
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      const h = Math.abs(hash) % 360;
      fallback.style.backgroundColor = `hsl(${h}, 65%, 45%)`;
      fallback.style.color = '#fff';

      // Get initials
      const parts = name.trim().split(/\s+/);
      let initials = "";
      if (parts.length >= 2) {
        initials = parts[0][0] + parts[1][0];
      } else if (parts[0]) {
        initials = parts[0].substring(0, 2);
      }
      fallback.textContent = initials.toUpperCase() || "?";
      
      wrapper.replaceChild(fallback, img);
    }

    // Toast Notifications
    function showToast(message, type = 'primary') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      
      let icon = ICONS.bookmark;
      if (type === 'success') icon = ICONS.check;
      if (type === 'danger') icon = ICONS.trash;
      if (type === 'warning') icon = ICONS.alert;

      toast.innerHTML = `
        <span class="toast-icon">${icon}</span>
        <span>${message}</span>
      `;
      
      container.appendChild(toast);
      
      // Auto-dismiss
      setTimeout(() => {
        toast.style.transform = 'translateX(120%)';
        toast.style.opacity = '0';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Render Sidebars & Content
    function render() {
      renderCategories();
      renderTags();
      renderBookmarks();
      renderFiltersIndicator();
      populateCategorySelects();
    }

    function renderCategories() {
      const container = document.getElementById('categories-container');
      container.innerHTML = '';

      // Add "All" selector
      const totalCount = state.bookmarks.length;
      const allItem = document.createElement('li');
      allItem.className = `category-item ${state.activeCategory === 'All' ? 'active' : ''}`;
      allItem.innerHTML = `
        <div class="category-info">
          <span>${ICONS.bookmark}</span>
          <span>All Bookmarks</span>
        </div>
        <span class="category-badge">${totalCount}</span>
      `;
      allItem.onclick = () => {
        state.activeCategory = 'All';
        state.activeTag = null; // Clear tag filter when switching category
        render();
      };
      container.appendChild(allItem);

      // Render custom categories
      state.categories.forEach(cat => {
        const count = state.bookmarks.filter(b => b.category === cat).length;
        const item = document.createElement('li');
        item.className = `category-item ${state.activeCategory === cat ? 'active' : ''}`;
        
        // Use consistent folder symbol
        item.innerHTML = `
          <div class="category-info">
            <span>${ICONS.folder}</span>
            <span>${escapeHTML(cat)}</span>
          </div>
          <span class="category-badge">${count}</span>
        `;
        item.onclick = () => {
          state.activeCategory = cat;
          state.activeTag = null; // Clear tag filter
          render();
        };
        container.appendChild(item);
      });
    }

    function renderTags() {
      const container = document.getElementById('tags-container');
      container.innerHTML = '';

      // Aggregate tags
      const tagCounts = {};
      state.bookmarks.forEach(b => {
        if (b.tags && Array.isArray(b.tags)) {
          b.tags.forEach(t => {
            const normalized = t.toLowerCase().trim();
            if (normalized) {
              tagCounts[normalized] = (tagCounts[normalized] || 0) + 1;
            }
          });
        }
      });

      const tags = Object.keys(tagCounts).sort();
      if (tags.length === 0) {
        container.innerHTML = '<span style="font-size: 0.75rem; color: var(--text-muted); padding-left: 0.5rem;">No tags defined</span>';
        return;
      }

      tags.forEach(tag => {
        const badge = document.createElement('span');
        badge.className = `tag-badge ${state.activeTag === tag ? 'active' : ''}`;
        badge.textContent = `${tag} (${tagCounts[tag]})`;
        badge.onclick = (e) => {
          e.stopPropagation();
          state.activeTag = state.activeTag === tag ? null : tag;
          render();
        };
        container.appendChild(badge);
      });
    }

    function renderFiltersIndicator() {
      const container = document.getElementById('filter-indicator-container');
      container.innerHTML = '';

      const hasTag = !!state.activeTag;
      const hasSearch = !!state.searchQuery;

      if (!hasTag && !hasSearch) return;

      const indicator = document.createElement('div');
      indicator.className = 'active-filters';
      indicator.innerHTML = '<span>Active Filters:</span>';

      if (hasSearch) {
        const chip = document.createElement('span');
        chip.className = 'filter-chip';
        chip.innerHTML = `Search: "${escapeHTML(state.searchQuery)}" <button onclick="clearSearchFilter()">${ICONS.x}</button>`;
        indicator.appendChild(chip);
      }

      if (hasTag) {
        const chip = document.createElement('span');
        chip.className = 'filter-chip';
        chip.innerHTML = `Tag: ${escapeHTML(state.activeTag)} <button onclick="clearTagFilter()">${ICONS.x}</button>`;
        indicator.appendChild(chip);
      }

      container.appendChild(indicator);
    }

    function clearSearchFilter() {
      state.searchQuery = '';
      document.getElementById('search-input').value = '';
      render();
    }

    function clearTagFilter() {
      state.activeTag = null;
      render();
    }

    function renderBookmarks() {
      const grid = document.getElementById('bookmarks-grid-container');
      const emptyState = document.getElementById('empty-state-container');
      const openAllBtn = document.getElementById('open-all-cat-btn');
      
      grid.innerHTML = '';
      
      // Update Main Header Title & Icon
      const titleTextEl = document.getElementById('category-title-text');
      const titleIconEl = document.getElementById('title-icon');
      titleTextEl.textContent = state.activeCategory === 'All' ? 'All Bookmarks' : state.activeCategory;
      titleIconEl.innerHTML = state.activeCategory === 'All' ? ICONS.bookmark : ICONS.folder;

      // Show/Hide Open All Button
      if (state.activeCategory !== 'All') {
        openAllBtn.style.display = 'inline-flex';
      } else {
        openAllBtn.style.display = 'none';
      }

      // Filter state.bookmarks based on Category, Tag, and Search Query
      const filtered = state.bookmarks.filter(b => {
        // Category Filter
        if (state.activeCategory !== 'All' && b.category !== state.activeCategory) return false;

        // Tag Filter
        if (state.activeTag && (!b.tags || !b.tags.map(t => t.toLowerCase().trim()).includes(state.activeTag))) return false;

        // Search Filter (Title, URL, Tags, or Description)
        if (state.searchQuery) {
          const q = state.searchQuery.toLowerCase();
          const matchTitle = b.name.toLowerCase().includes(q);
          const matchUrl = b.url.toLowerCase().includes(q);
          const matchDesc = b.description && b.description.toLowerCase().includes(q);
          const matchTags = b.tags && b.tags.some(t => t.toLowerCase().includes(q));
          if (!matchTitle && !matchUrl && !matchDesc && !matchTags) return false;
        }

        return true;
      });

      if (filtered.length === 0) {
        grid.style.display = 'none';
        emptyState.style.display = 'flex';
        
        // Contextualize empty state text
        if (state.searchQuery || state.activeTag) {
          document.getElementById('empty-state-title').textContent = "No matching bookmarks";
          document.getElementById('empty-state-text').textContent = "Try refining your search query or clear the filters.";
          document.getElementById('empty-state-action-btn').style.display = 'none';
        } else {
          document.getElementById('empty-state-title').textContent = "Empty Category";
          document.getElementById('empty-state-text').textContent = `No bookmarks saved in "${state.activeCategory}" yet.`;
          document.getElementById('empty-state-action-btn').style.display = 'inline-flex';
        }
      } else {
        grid.style.display = 'grid';
        emptyState.style.display = 'none';

        filtered.forEach(b => {
          const card = document.createElement('div');
          card.className = 'bookmark-card';
          card.onclick = () => window.open(b.url, '_blank');
          
          let domain = "";
          try {
            domain = new URL(b.url).hostname;
          } catch(e) {
            domain = b.url;
          }

          // Build Tags HTML
          let tagsHtml = '';
          if (b.tags && b.tags.length > 0) {
            tagsHtml = `
              <div class="card-tags">
                ${b.tags.map(t => `<span class="card-tag">${escapeHTML(t)}</span>`).join('')}
              </div>
            `;
          }

          // Fetch favicon with sizing parameters
          const faviconSrc = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

          card.innerHTML = `
            <div class="card-top">
              <div class="favicon-wrapper">
                <img class="favicon-img" src="${faviconSrc}" alt="" onerror="handleFaviconError(this, '${escapeJSString(b.name)}')" loading="lazy">
              </div>
              <div class="card-actions" onclick="event.stopPropagation();">
                <button class="action-btn" onclick="openLink('${escapeJSString(b.url)}')" title="Open Website">${ICONS.external}</button>
                <button class="action-btn" onclick="copyToClipboard('${escapeJSString(b.url)}')" title="Copy URL">${ICONS.copy}</button>
                <button class="action-btn edit-btn" onclick="openEditModal(${b.id})" title="Edit Bookmark">${ICONS.edit}</button>
                <button class="action-btn delete-btn" onclick="deleteBookmark(${b.id})" title="Delete Bookmark">${ICONS.trash}</button>
              </div>
            </div>
            <div class="card-body">
              <h3 class="card-title" title="${escapeHTML(b.name)}">${escapeHTML(b.name)}</h3>
              <a href="${b.url}" class="card-domain" target="_blank" onclick="event.stopPropagation();">
                ${domain}
              </a>
              ${b.description ? `<p class="card-description">${escapeHTML(b.description)}</p>` : ''}
              ${tagsHtml}
            </div>
          `;
          grid.appendChild(card);
        });
      }
    }

    // Populate Dialog dropdown lists
    function populateCategorySelects() {
      const select = document.getElementById('bookmark-category');
      select.innerHTML = '';
      state.categories.forEach(c => {
        const option = document.createElement('option');
        option.value = c;
        option.textContent = c;
        select.appendChild(option);
      });
    }

    // Action Handlers
    function openLink(url) {
      window.open(url, '_blank');
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast("URL copied to clipboard!", "success");
      }).catch(err => {
        showToast("Failed to copy URL", "danger");
      });
    }

    function deleteBookmark(id) {
      if (confirm("Are you sure you want to delete this bookmark?")) {
        state.bookmarks = state.bookmarks.filter(b => b.id !== id);
        saveState();
        render();
        showToast("Bookmark deleted", "danger");
      }
    }

    // Add / Edit Modal Controls
    const bookmarkDialog = document.getElementById('bookmark-dialog');
    const bookmarkForm = document.getElementById('bookmark-form');
    
    document.getElementById('add-bookmark-btn').addEventListener('click', () => openAddModal());
    document.getElementById('empty-state-action-btn').addEventListener('click', () => openAddModal());
    
    document.getElementById('dialog-close-btn').addEventListener('click', () => bookmarkDialog.close());
    document.getElementById('dialog-cancel-btn').addEventListener('click', () => bookmarkDialog.close());

    function openAddModal() {
      document.getElementById('dialog-title').textContent = "Add Bookmark";
      document.getElementById('bookmark-id').value = "";
      bookmarkForm.reset();
      
      // Auto-set category if we are filtering a specific category
      if (state.activeCategory !== 'All') {
        document.getElementById('bookmark-category').value = state.activeCategory;
      }
      
      bookmarkDialog.showModal();
    }

    function openEditModal(id) {
      const bookmark = state.bookmarks.find(b => b.id === id);
      if (!bookmark) return;

      document.getElementById('dialog-title').textContent = "Edit Bookmark";
      document.getElementById('bookmark-id').value = bookmark.id;
      document.getElementById('bookmark-name').value = bookmark.name;
      document.getElementById('bookmark-url').value = bookmark.url;
      document.getElementById('bookmark-category').value = bookmark.category;
      document.getElementById('bookmark-tags').value = bookmark.tags ? bookmark.tags.join(', ') : '';
      document.getElementById('bookmark-description').value = bookmark.description || '';

      bookmarkDialog.showModal();
    }

    bookmarkForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const idVal = document.getElementById('bookmark-id').value;
      const name = document.getElementById('bookmark-name').value.trim();
      let url = document.getElementById('bookmark-url').value.trim();
      const category = document.getElementById('bookmark-category').value;
      const tagsVal = document.getElementById('bookmark-tags').value;
      const description = document.getElementById('bookmark-description').value.trim();

      if (!name || !url) return;

      // Auto-prefix URL protocol if missing
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }

      // Parse tags
      const tags = tagsVal
        .split(',')
        .map(t => t.trim())
        .filter(t => t.length > 0);

      if (idVal) {
        // Edit existing
        const index = state.bookmarks.findIndex(b => b.id === parseInt(idVal));
        if (index !== -1) {
          state.bookmarks[index] = {
            ...state.bookmarks[index],
            name,
            url,
            category,
            tags,
            description
          };
          showToast("Bookmark updated successfully", "success");
        }
      } else {
        // Create new
        const newB = {
          id: Date.now(),
          name,
          url,
          category,
          tags,
          description
        };
        state.bookmarks.unshift(newB);
        showToast("Bookmark added successfully", "success");
      }

      saveState();
      bookmarkDialog.close();
      render();
    });

    // Create Category Controls
    const categoryDialog = document.getElementById('category-dialog');
    const categoryForm = document.getElementById('category-form');

    document.getElementById('create-cat-shortcut-btn').addEventListener('click', () => {
      categoryForm.reset();
      categoryDialog.showModal();
    });

    document.getElementById('cat-dialog-close-btn').addEventListener('click', () => categoryDialog.close());
    document.getElementById('cat-dialog-cancel-btn').addEventListener('click', () => categoryDialog.close());

    categoryForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const newCatName = document.getElementById('category-name').value.trim();
      
      if (!newCatName) return;

      if (state.categories.some(c => c.toLowerCase() === newCatName.toLowerCase())) {
        showToast("Category already exists", "warning");
        return;
      }

      state.categories.push(newCatName);
      saveState();
      populateCategorySelects();
      
      // Set the newly created category in the dropdown
      document.getElementById('bookmark-category').value = newCatName;
      
      categoryDialog.close();
      render();
      showToast(`Category "${newCatName}" created`, "success");
    });

    // Global Action Handlers
    document.getElementById('open-all-cat-btn').addEventListener('click', () => {
      if (state.activeCategory === 'All') return;
      const targets = state.bookmarks.filter(b => b.category === state.activeCategory);
      if (targets.length === 0) return;
      
      if (confirm(`Open all ${targets.length} bookmarks in "${state.activeCategory}"? Your browser may request popup permissions.`)) {
        targets.forEach(b => window.open(b.url, '_blank'));
      }
    });

    // Search bar functionality
    const searchInput = document.getElementById('search-input');
    searchInput.addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      render();
    });

    // Shortcut focus for search
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchInput && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      }
    });

    // Theme Selector Listener
    document.getElementById('theme-toggle-btn').addEventListener('click', toggleTheme);

    // Export Bookmarks
    document.getElementById('export-btn').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      
      const date = new Date().toISOString().slice(0,10);
      downloadAnchor.setAttribute("download", `portal-bookmarks-backup-${date}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      
      showToast("Backup file exported!", "success");
    });

    // Import Bookmarks
    const fileImportInput = document.getElementById('file-import-input');
    document.getElementById('import-btn').addEventListener('click', () => {
      fileImportInput.click();
    });

    fileImportInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const parsed = JSON.parse(event.target.result);
          if (parsed && Array.isArray(parsed.bookmarks)) {
            // Validate & merge arrays
            state.bookmarks = parsed.bookmarks;
            if (Array.isArray(parsed.categories)) {
              state.categories = parsed.categories;
            }
            saveState();
            render();
            showToast("Bookmarks imported successfully!", "success");
          } else {
            showToast("Invalid backup file format", "danger");
          }
        } catch (err) {
          showToast("Failed to parse backup JSON file", "danger");
        }
      };
      reader.readAsText(file);
      // Reset input
      fileImportInput.value = '';
    });

    // Reset Portal
    document.getElementById('reset-btn').addEventListener('click', () => {
      if (confirm("WARNING: This will delete ALL bookmarks and restore defaults. Proceed?")) {
        localStorage.clear();
        loadState();
        render();
        showToast("Portal reset to defaults", "warning");
      }
    });

    // Helper functions
    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    function escapeJSString(str) {
      if (!str) return '';
      return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n');
    }

    // App Initialization
    window.addEventListener('DOMContentLoaded', () => {
      injectIcons();
      loadState();
      initClock();
      render();
    });
  </script>
</body>
</html>
